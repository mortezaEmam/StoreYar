openapi: 3.1.0
info:
  title: StoreYar API
  version: 1.0.0
  description: Multi-tenant commerce API (Identity, Organization, Catalog, Inventory, Sales, Payments, Shipping).
servers:
  - url: /api
    description: Application API

tags:
  - name: Auth
  - name: Organizations
  - name: Members
  - name: Products
  - name: Stock
  - name: Orders
  - name: Payments
  - name: Shipments
  - name: Audit

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque session token

  parameters:
    BusinessId:
      name: X-Business-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 26
        maxLength: 26
      description: Organization (business) context ULID
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 26
        maxLength: 26

  headers:
    IdempotencyReplayed:
      description: true when response is a replay of a prior successful request
      schema:
        type: string
        enum: ["true", "false"]

  schemas:
    ErrorMessage:
      type: object
      required: [message]
      properties:
        message:
          type: string
    PageMeta:
      type: object
      required: [page, per_page, total, last_page]
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }
    TokenData:
      type: object
      properties:
        token: { type: string }
        user:
          type: object
          properties:
            id: { type: string }
            email: { type: string }
            name: { type: string }
    Organization:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string, enum: [active, suspended] }
    Product:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        name: { type: string }
        sku: { type: string }
        unit_price_amount: { type: integer }
        currency: { type: string }
        status: { type: string }
    StockItem:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        product_id: { type: string }
        quantity: { type: integer }
        reserved_quantity: { type: integer }
    Order:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        status: { type: string, enum: [draft, confirmed, paid, cancelled] }
        lines:
          type: array
          items:
            type: object
            properties:
              product_id: { type: string }
              quantity: { type: integer }
              unit_price_amount: { type: integer }
        total_amount: { type: integer }
        currency: { type: string }
    Payment:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        order_id: { type: string }
        amount: { type: integer }
        currency: { type: string }
        status: { type: string, enum: [pending, succeeded, failed, refunded] }
    Shipment:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        order_id: { type: string }
        status: { type: string, enum: [pending, shipped, delivered, cancelled] }
        tracking_number: { type: string, nullable: true }
    AuditEntry:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string, nullable: true }
        actor_user_id: { type: string, nullable: true }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string, nullable: true }
        payload: { type: object, nullable: true }
        ip_address: { type: string, nullable: true }
        occurred_at: { type: string }

  responses:
    BadRequest:
      description: Missing or invalid header/body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    Unauthorized:
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    Unprocessable:
      description: Domain/validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    Conflict:
      description: Idempotency key in progress
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password, password_confirmation]
              properties:
                email: { type: string, format: email }
                name: { type: string }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TokenData'
        '422':
          $ref: '#/components/responses/Unprocessable'


  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: Accepted
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, password, password_confirmation]
              properties:
                email: { type: string, format: email }
                token: { type: string }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        '200':
          description: OK
        '422':
          $ref: '#/components/responses/Unprocessable'
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TokenData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          description: Rate limited

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (revoke session)
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/rotate:
    post:
      tags: [Auth]
      summary: Rotate session token
      responses:
        '200':
          description: New token issued
        '401':
          $ref: '#/components/responses/Unauthorized'


  /business/ping:
    get:
      tags: [Auth]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
      summary: Resolve current business context (session + X-Business-Id)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  business_id: { type: string }
                  branch_id: { type: string, nullable: true }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /organizations:
    get:
      tags: [Organizations]
      summary: List organizations for current user
      responses:
        '200':
          description: OK
    post:
      tags: [Organizations]
      summary: Create organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Organization'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /organizations/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Organizations]
      summary: Show organization
      responses:
        '200':
          description: OK
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Organizations]
      summary: Rename organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '200':
          description: OK
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/{id}/suspend:
    post:
      tags: [Organizations]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      summary: Suspend organization
      responses:
        '200':
          description: OK

  /organizations/{id}/activate:
    post:
      tags: [Organizations]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      summary: Activate organization
      responses:
        '200':
          description: OK

  /organizations/{id}/branches:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Organizations]
      summary: List branches
      responses:
        '200':
          description: OK
    post:
      tags: [Organizations]
      summary: Create branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: Created

  /organizations/{id}/members:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Members]
      summary: List members
      responses:
        '200':
          description: OK
    post:
      tags: [Members]
      summary: Grant membership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, role]
              properties:
                user_id: { type: string }
                role: { type: string, enum: [owner, admin, member] }
      responses:
        '201':
          description: Created
        '422':
          $ref: '#/components/responses/Unprocessable'

  /organizations/{id}/members/{userId}:
    patch:
      tags: [Members]
      summary: Change member role
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [owner, admin, member] }
      responses:
        '200':
          description: OK
    delete:
      tags: [Members]
      summary: Revoke membership
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
        '204':
          description: No content

  /products:
    get:
      tags: [Products]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      summary: List products
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
    post:
      tags: [Products]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, sku, unit_price_amount]
              properties:
                name: { type: string }
                sku: { type: string }
                unit_price_amount: { type: integer, minimum: 0 }
                currency: { type: string, default: IRR }
      responses:
        '201':
          description: Created
        '422':
          $ref: '#/components/responses/Unprocessable'

  /products/{id}:
    get:
      tags: [Products]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/ResourceId'
      summary: Show product
      responses:
        '200':
          description: OK
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Products]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/ResourceId'
      summary: Rename product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '200':
          description: OK
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /products/{id}/price:
    patch:
      tags: [Products]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/ResourceId'
      summary: Change product unit price
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [unit_price_amount]
              properties:
                unit_price_amount: { type: integer, minimum: 0 }
                currency: { type: string, default: IRR }
      responses:
        '200':
          description: OK
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /products/{id}/activate:
    post:
      tags: [Products]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/ResourceId'
      summary: Activate product
      responses:
        '200':
          description: OK

  /products/{id}/archive:
    post:
      tags: [Products]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/ResourceId'
      summary: Archive product
      responses:
        '200':
          description: OK

  /stock:
    get:
      tags: [Stock]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      summary: List stock
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StockItem'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
    post:
      tags: [Stock]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/IdempotencyKey'
      summary: Initialize stock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, quantity]
              properties:
                product_id: { type: string }
                quantity: { type: integer, minimum: 0 }
      responses:
        '201':
          description: Created
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
        '200':
          description: Idempotent replay
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /stock/{productId}:
    get:
      tags: [Stock]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - name: productId
          in: path
          required: true
          schema: { type: string }
      summary: Show stock for product
      responses:
        '200':
          description: OK
        '404':
          $ref: '#/components/responses/NotFound'

  /stock/{productId}/adjust:
    post:
      tags: [Stock]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: productId
          in: path
          required: true
          schema: { type: string }
      summary: Adjust stock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, direction]
              properties:
                amount: { type: integer, minimum: 1 }
                direction: { type: string, enum: [increase, decrease] }
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /orders:
    get:
      tags: [Orders]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      summary: List orders
      responses:
        '200':
          description: OK
    post:
      tags: [Orders]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/IdempotencyKey'
      summary: Create order (draft)
      responses:
        '201':
          description: Created
        '200':
          description: Idempotent replay
        '400':
          $ref: '#/components/responses/BadRequest'

  /orders/{id}:
    get:
      tags: [Orders]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/ResourceId'
      summary: Show order
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{id}/lines:
    post:
      tags: [Orders]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/ResourceId'
      summary: Add order line (reserves stock)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, quantity]
              properties:
                product_id: { type: string }
                quantity: { type: integer, minimum: 1 }
      responses:
        '200':
          description: OK
        '422':
          $ref: '#/components/responses/Unprocessable'

  /orders/{id}/confirm:
    post:
      tags: [Orders]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ResourceId'
      summary: Confirm order (commit reserved stock)
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /orders/{id}/cancel:
    post:
      tags: [Orders]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ResourceId'
      summary: Cancel order
      responses:
        '200':
          description: OK
        '422':
          $ref: '#/components/responses/Unprocessable'

  /payments:
    get:
      tags: [Payments]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      summary: List payments
      responses:
        '200':
          description: OK
    post:
      tags: [Payments]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/IdempotencyKey'
      summary: Initiate payment (order must be confirmed)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id]
              properties:
                order_id: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Payment'
        '200':
          description: Idempotent replay
        '422':
          $ref: '#/components/responses/Unprocessable'

  /payments/{id}:
    get:
      tags: [Payments]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/ResourceId'
      summary: Show payment
      responses:
        '200':
          description: OK
        '404':
          $ref: '#/components/responses/NotFound'

  /payments/{id}/succeed:
    post:
      tags: [Payments]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/ResourceId'
      summary: Mark payment succeeded (sandbox) — order becomes paid
      responses:
        '200':
          description: OK
        '422':
          $ref: '#/components/responses/Unprocessable'

  /payments/{id}/fail:
    post:
      tags: [Payments]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/ResourceId'
      summary: Mark payment failed
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: OK

  /payments/{id}/refund:
    post:
      tags: [Payments]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/ResourceId'
      summary: Refund succeeded payment — order back to confirmed
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: OK
        '422':
          $ref: '#/components/responses/Unprocessable'

  /shipments:
    get:
      tags: [Shipments]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      summary: List shipments
      responses:
        '200':
          description: OK
    post:
      tags: [Shipments]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/IdempotencyKey'
      summary: Create shipment (order must be paid)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id]
              properties:
                order_id: { type: string }
      responses:
        '201':
          description: Created
        '200':
          description: Idempotent replay
        '422':
          $ref: '#/components/responses/Unprocessable'

  /shipments/{id}:
    get:
      tags: [Shipments]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/ResourceId'
      summary: Show shipment
      responses:
        '200':
          description: OK
        '404':
          $ref: '#/components/responses/NotFound'

  /shipments/{id}/ship:
    post:
      tags: [Shipments]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ResourceId'
      summary: Mark shipped
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tracking_number]
              properties:
                tracking_number: { type: string }
      responses:
        '200':
          description: OK
        '422':
          $ref: '#/components/responses/Unprocessable'

  /shipments/{id}/deliver:
    post:
      tags: [Shipments]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ResourceId'
      summary: Mark delivered
      responses:
        '200':
          description: OK
        '422':
          $ref: '#/components/responses/Unprocessable'

  /shipments/{id}/cancel:
    post:
      tags: [Shipments]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ResourceId'
      summary: Cancel shipment (not after delivered)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: OK
        '422':
          $ref: '#/components/responses/Unprocessable'

  /audit-log:
    get:
      tags: [Audit]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: resource_type
          in: query
          schema: { type: string }
        - name: resource_id
          in: query
          schema: { type: string }
      summary: List audit log entries
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
