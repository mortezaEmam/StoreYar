name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: storeyar_testing
          MYSQL_USER: storeyar
          MYSQL_PASSWORD: storeyar
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, mbstring, pdo, pdo_mysql
          coverage: none
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.testing .env
      - run: php artisan key:generate --force
      - name: Configure test database
        run: |
          echo "DB_CONNECTION=mysql" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_DATABASE=storeyar_testing" >> .env
          echo "DB_USERNAME=storeyar" >> .env
          echo "DB_PASSWORD=storeyar" >> .env
          echo "MAIL_MAILER=array" >> .env
          echo "FRONTEND_URL=http://localhost:3000" >> .env
      - run: php artisan migrate --force
      - run: find app tests -type f -name "*.php" -print0 | xargs -0 -n1 php -l
      - run: php artisan test tests/Architecture
      - run: php artisan test tests/Security
      - run: php artisan test tests/Contract
      - run: php artisan test tests/Feature/Modules/Identity/PasswordResetTest.php
      - run: php artisan test tests/Feature/Shared/RequestIdMiddlewareTest.php
      - run: php artisan test

  frontend:
    name: Frontend install and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm install --legacy-peer-deps
      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
      - name: Prepare Nuxt
        run: npx nuxi prepare
      - name: Production build
        run: npm run build
        env:
          NUXT_PUBLIC_API_BASE: http://localhost:8000/api
